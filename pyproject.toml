[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "immich-dvd-archiver"
version = "0.2.0"
description = "Resize an Immich photo library to 1920x1080 JPEG and split it into DVD-sized folders"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Denis Osinkin", email = "osinkin@gmail.com" }]
keywords = ["immich", "dvd", "archive", "photos", "jpeg", "resize"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: System :: Archiving",
]
dependencies = [
    "Pillow>=10.4",
    "pillow-heif>=0.18",
]

[project.urls]
Repository = "https://github.com/OWNER/immich-dvd-archiver"
Issues = "https://github.com/OWNER/immich-dvd-archiver/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
immich-dvd = "immich_dvd.cli:main"

[tool.setuptools.packages.find]
include = ["immich_dvd*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "SIM115", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
